# HOW TO USE:
# 1. Duplicate this file in the exact same folder.
# 2. Rename the duplicated file to `secrets.toml`.
# 3. Replace the mock URLs below with your real endpoints.
# NOTE: `secrets.toml` is ignored by Git. Never commit real keys.

