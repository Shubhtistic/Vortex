services:
  postgres:
    image: postgres:17-slim
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - vortex_pg_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 3
  # alembic container
  migrate:
    build: .
    env_file: .env
    command: alembic upgrade head # closes the container after this as pid 1 gets completed
    depends_on:
      postgres:
        condition: service_healthy 

  # redis
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    deploy:
      resources:
        reservations:
          memory: 32M
        limits:
          memory: 128M
          cpus: '0.25'

  fastapi:
    build: .
    command: ["uvicorn", "vortex.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./src:/vortex/src
    deploy:
      resources:
        reservations:
          memory: 128M
        limits:
          memory: 512M
          cpus: '0.50'
    depends_on:
      migrate:
        condition: service_completed_successfully  # migrations must finish before api starts
      redis:
        condition: service_started 


volumes:
  vortex_pg_data: