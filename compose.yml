# used new compose.yml file instead of docker-compose.yml
# still backwards compatible so name wont cause any issue
# in compose.yml we dont need to declare any version

# a service is just a fancy name for our containers
# every service will be individual container

# docker dependancy chain 
# 1)no dependencies, start immediately together -> postgres_database + redis
# 2) waits for postgres_database to be healthy -> migrate (runs alembic upgrade head, then exits)
# 3)waits for migrate to complete successfully -> api + worker

# Docker does NOT go top to bottom — it reads the depends_on graph.
# Even if we reorder services in this file, the startup order stays the same.
# Services at the same step start in parallel.

services:
  # database
  # starts immediately, no dependencies
  postgres_database:
    image: postgres:15-alpine
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 3
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - vortex_pg_data:/var/lib/postgresql/data

  # waits for postgres_database to pass healthcheck, then runs migrations and exits
  # api and worker depend on this completing, so postgres being healthy is implicit for them too
  migrate:
    build: .
    env_file: .env
    command: alembic upgrade head # closes the container after this as pid 1 gets completed
    depends_on:
      postgres_database:
        condition: service_healthy  # waits until pg_isready passes

  #starts alongside postgres_database, no dependencies
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    deploy:
      resources:
        reservations:
          memory: 32M
        limits:
          memory: 128M
          cpus: '0.25'

  # starts only after migrate exits with code 0
  # --reload watches for file changes in dev (volumes mount ./app so changes reflect instantly)
  api:
    build: .
    entrypoint: [""] 
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./app:/vortex/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    deploy:
      resources:
        reservations:
          memory: 128M
        limits:
          memory: 512M
          cpus: '0.50'
    depends_on:
      migrate:
        condition: service_completed_successfully  # migrations must finish before api starts
      redis:
        condition: service_started                 # redis just needs to be running

  # starts in parallel with api, also after migrate completes
  worker:
    build: .
    entrypoint: [""]
    env_file:
      - .env
    volumes:
      - ./app:/vortex/app
    command: arq app.worker.WorkerSettings
    restart: on-failure 
    deploy:
      resources:
        reservations:
          memory: 128M
        limits:
          memory: 512M
          cpus: '0.50'
    depends_on:
      migrate:
        condition: service_completed_successfully 
      redis:
        condition: service_started                

volumes:
  vortex_pg_data: