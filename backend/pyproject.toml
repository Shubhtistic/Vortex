[project]
name = "vortex"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Shubhtistic", email = "theshubham1412@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.1",
    "argon2-cffi>=25.1.0",
    "arq>=0.25.0",
    "asyncpg>=0.31.0",
    "black>=26.5.1",
    "blake3>=1.0.9",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "orjson>=3.12.0",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.4",
    "pyjwt>=2.13.0",
    "redis[hiredis]>=8.1.0",
    "scalar-fastapi>=1.8.2",
    "sqlalchemy>=2.0.52",
    "sqlmodel>=0.0.39",
    "uvicorn>=0.52.4",
]

[project.scripts]
vortex = "vortex:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
