worker_processes 1;
worker_rlimit_nofile 65536;

events {
  worker_connections 8192;
}

http {
  # Refresh Docker's service DNS so scaled/replaced FastAPI replicas are discovered.
  resolver 127.0.0.11 valid=5s ipv6=off;

  upstream fastapi_backend {
    # Round robin is the default; resolve the single Compose service dynamically.
    zone fastapi_backend 64k;
    server fastapi:8000 resolve max_fails=3 fail_timeout=5s;
    keepalive 64;
  }

  server {
    listen 80;
    server_name _;
    client_max_body_size 10m;
    client_body_timeout 15s;
    send_timeout 30s;

    location / {
      proxy_pass http://fastapi_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 2s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
      # Do not add "non_idempotent": retrying a sent event POST may duplicate it.
      proxy_next_upstream error timeout http_502 http_503;
    }
  }
}
