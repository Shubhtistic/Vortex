# used new compose.yml file instead of docker-compose.yml
# still backwards compatible so name wont cause any issue
# in compose.yml we dont need to declare any version


# a service is just a fancy name for our containers
# every service will be individual container
services:
  #database
  postgres_database:
    image: postgres:15-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - vortex_pg_data:/var/lib/postgresql/data
  redis: 
    image: redis:7-alpine
    ports:
        - "6380:6379" 
  
  api: 
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./app:/vortex/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - postgres_database
      - redis
  worker: 
    build: .
    env_file: 
      - .env
    volumes: 
      - ./app:/vortex/app
    command: celery -A app.core.celery_app worker --loglevel=info
    restart: on-failure
    depends_on: 
      - postgres_database
      - redis

volumes:
  vortex_pg_data: